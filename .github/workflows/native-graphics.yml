name: Native graphics policy
on:
  push:
    paths:
      - 'src/output/**'
      - 'src/gui/sdlmain.cpp'
      - 'src/shell/shell.cpp'
      - 'tests/verify_native_graphics.py'
      - 'tests/verify_native_macos_host.py'
      - 'src/platform/macos/**'
      - 'src/Makefile.am'
      - 'configure.ac'
      - 'build-macos'
      - 'build-macos-sdl2'
      - '.github/workflows/native-graphics.yml'
  pull_request:
    paths:
      - 'src/output/**'
      - 'src/gui/sdlmain.cpp'
      - 'src/shell/shell.cpp'
      - 'tests/verify_native_graphics.py'
      - 'tests/verify_native_macos_host.py'
      - 'src/platform/macos/**'
      - 'src/Makefile.am'
      - 'configure.ac'
      - 'build-macos'
      - 'build-macos-sdl2'
      - '.github/workflows/native-graphics.yml'
permissions:
  contents: read
jobs:
  output-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify platform defaults, overrides, modes, and pixels
        run: python3 tests/verify_native_graphics.py
      - name: Verify native macOS host boundary
        run: python3 tests/verify_native_macos_host.py
