name: Native graphics policy
on:
  push:
    paths:
      - 'src/output/**'
      - 'src/gui/sdlmain.cpp'
      - 'src/gui/sdl_gui.cpp'
      - 'src/gui/menu.cpp'
      - 'include/mapper.h'
      - 'include/sdlmain.h'
      - 'include/Makefile.am'
      - 'src/misc/clipboard.cpp'
      - 'src/misc/messages.cpp'
      - 'include/codepage.h'
      - 'include/macosx_host.h'
      - 'src/gui/menu_macos.mm'
      - 'src/gui/Makefile.am'
      - 'src/shell/shell.cpp'
      - 'tests/verify_native_graphics.py'
      - 'tests/verify_native_macos_host.py'
      - 'src/platform/macos/**'
      - 'src/Makefile.am'
      - 'configure.ac'
      - 'build'
      - 'build'
      - 'build-macos'
      - 'build-macos-sdl2'
      - 'scripts/resolve-macos-sdk.bash'
      - 'scripts/bootstrap-native-llvm.bash'
      - '.github/workflows/native-graphics.yml'
  pull_request:
    paths:
      - 'src/output/**'
      - 'src/gui/sdlmain.cpp'
      - 'src/gui/sdl_gui.cpp'
      - 'src/gui/menu.cpp'
      - 'include/mapper.h'
      - 'include/sdlmain.h'
      - 'include/Makefile.am'
      - 'src/misc/clipboard.cpp'
      - 'src/misc/messages.cpp'
      - 'include/codepage.h'
      - 'include/macosx_host.h'
      - 'src/gui/menu_macos.mm'
      - 'src/gui/Makefile.am'
      - 'src/shell/shell.cpp'
      - 'tests/verify_native_graphics.py'
      - 'tests/verify_native_macos_host.py'
      - 'src/platform/macos/**'
      - 'src/Makefile.am'
      - 'configure.ac'
      - 'build-macos'
      - 'build-macos-sdl2'
      - 'scripts/resolve-macos-sdk.bash'
      - 'scripts/bootstrap-native-llvm.bash'
      - '.github/workflows/native-graphics.yml'
permissions:
  contents: read
jobs:
  output-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify platform defaults, overrides, modes, and pixels
        run: python3 tests/verify_native_graphics.py
      - name: Verify native macOS host boundary
        run: python3 tests/verify_native_macos_host.py

  macos-sdk:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Resolve and verify macOS SDK system headers
        run: |
          sdk="$(bash scripts/resolve-macos-sdk.bash)"
          test -f "$sdk/usr/include/sys/types.h"
          printf '#include <sys/types.h>\nstatic off_t probe;\nint main(void) { return probe != 0; }\n' |
            SDKROOT="$sdk" clang -std=c11 -Wall -Wextra -Werror -x c -fsyntax-only -
