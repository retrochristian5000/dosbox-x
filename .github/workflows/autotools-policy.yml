name: Autotools policy

on:
  push:
    paths:
      - 'configure.ac'
      - 'acinclude.m4'
      - 'autogen.sh'
      - 'Makefile.am'
      - 'include/Makefile.am'
      - 'src/**/Makefile.am'
      - 'tests/verify_autoconf_policy.py'
      - 'tests/verify_external_headers.py'
      - 'scripts/resolve-macos-sdk.bash'
      - 'tests/verify_automake_policy.py'
      - 'tests/verify_sdl3_lifecycle.py'
      - 'tests/verify_gamelink_sdl3.py'
      - 'src/gamelink/**'
      - 'src/output/output_gamelink.cpp'
      - 'src/output/gamelink_sdl_keyboard.h'
      - 'src/gui/sdlmain.cpp'
      - '.github/workflows/autotools-policy.yml'
  pull_request:
    paths:
      - 'configure.ac'
      - 'acinclude.m4'
      - 'autogen.sh'
      - 'Makefile.am'
      - 'include/Makefile.am'
      - 'src/**/Makefile.am'
      - 'tests/verify_autoconf_policy.py'
      - 'tests/verify_external_headers.py'
      - 'scripts/resolve-macos-sdk.bash'
      - 'tests/verify_automake_policy.py'
      - 'tests/verify_sdl3_lifecycle.py'
      - 'tests/verify_gamelink_sdl3.py'
      - 'src/gamelink/**'
      - 'src/output/output_gamelink.cpp'
      - 'src/output/gamelink_sdl_keyboard.h'
      - 'src/gui/sdlmain.cpp'
      - '.github/workflows/autotools-policy.yml'

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify configure.ac modernization guard
        run: python3 tests/verify_autoconf_policy.py
      - name: Verify external header discovery and SDK compiler boundary
        run: python3 tests/verify_external_headers.py
      - name: Verify SDL3 lifecycle API migration
        run: python3 tests/verify_sdl3_lifecycle.py
      - name: Verify GameLink keyboard-event ABI and backend gate
        run: python3 tests/verify_gamelink_sdl3.py
      - name: Verify Automake graph and portability guard
        run: python3 tests/verify_automake_policy.py
      - name: Regenerate Autotools files
        run: ./autogen.sh
